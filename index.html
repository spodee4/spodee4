<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mx — AI Email</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#000000">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Mx">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="app">
    <!-- Sidebar -->
    <aside id="sidebar">
      <div class="sidebar-header">
        <h1 class="logo">Mx</h1>
        <span class="logo-badge">AI</span>
        <div class="theme-toggle" id="theme-toggle" title="Toggle theme">&#9790;</div>
      </div>

      <!-- Account Switcher -->
      <div class="account-switcher">
        <button class="account-tab active" data-account="all">
          All
        </button>
        <button class="account-tab" data-account="zoho-biz">
          <span class="account-dot" style="background:oklch(0.7162 0.1597 290.3962)"></span>Zoho
        </button>
        <button class="account-tab" data-account="zoho-web">
          <span class="account-dot" style="background:oklch(0.7482 0.1235 244.7492)"></span>Web
        </button>
        <button class="account-tab" data-account="gmail">
          <span class="account-dot" style="background:oklch(0.6861 0.2061 14.9941)"></span>Gmail
        </button>
      </div>

      <button id="compose-btn" class="btn-primary">+ Compose</button>

      <nav id="folders">
        <ul>
          <li class="folder active" data-folder="inbox">
            <span class="folder-icon">&#128229;</span> Inbox
            <span class="badge" id="inbox-count">3</span>
          </li>
          <li class="folder" data-folder="snoozed">
            <span class="folder-icon">&#9200;</span> Snoozed
            <span class="badge hidden" id="snoozed-count">0</span>
          </li>
          <li class="folder" data-folder="starred">
            <span class="folder-icon">&#9733;</span> Starred
          </li>
          <li class="folder" data-folder="sent">
            <span class="folder-icon">&#9993;</span> Sent
          </li>
          <li class="folder" data-folder="drafts">
            <span class="folder-icon">&#128221;</span> Drafts
          </li>
          <li class="folder" data-folder="trash">
            <span class="folder-icon">&#128465;</span> Trash
          </li>
        </ul>
      </nav>

      <!-- AI Triage Categories (Dan Martel Email GPS) -->
      <div class="triage-section">
        <div class="triage-header">
          <h3>AI Triage</h3>
          <button id="triage-all-btn" class="btn-ai btn-ai-sm">&#10024; Triage</button>
        </div>
        <ul id="triage-categories">
          <li class="triage-cat" data-category="all">
            <span class="cat-dot" style="background:var(--primary)"></span> All
            <span class="badge cat-badge" id="cat-all-count"></span>
          </li>
          <li class="triage-cat" data-category="respond">
            <span class="cat-dot" style="background:var(--star)"></span> Respond
            <span class="badge cat-badge" id="cat-respond-count"></span>
          </li>
          <li class="triage-cat" data-category="review">
            <span class="cat-dot" style="background:var(--chart-1)"></span> Review
            <span class="badge cat-badge" id="cat-review-count"></span>
          </li>
          <li class="triage-cat" data-category="waiting">
            <span class="cat-dot" style="background:var(--chart-3)"></span> Waiting On
            <span class="badge cat-badge" id="cat-waiting-count"></span>
          </li>
          <li class="triage-cat" data-category="receipts">
            <span class="cat-dot" style="background:var(--chart-2)"></span> Receipts
            <span class="badge cat-badge" id="cat-receipts-count"></span>
          </li>
          <li class="triage-cat" data-category="newsletter">
            <span class="cat-dot" style="background:var(--text-dim)"></span> Newsletter
            <span class="badge cat-badge" id="cat-newsletter-count"></span>
          </li>
          <li class="triage-cat" data-category="fyi">
            <span class="cat-dot" style="background:var(--chart-4)"></span> FYI
            <span class="badge cat-badge" id="cat-fyi-count"></span>
          </li>
        </ul>
      </div>

      <!-- AI Assistant Chat -->
      <div class="ai-section">
        <h3>Mx Assistant</h3>
        <div id="ai-chat">
          <div id="ai-messages"></div>
          <div class="ai-input-row">
            <input type="text" id="ai-input" placeholder="Tell Mx what to do...">
            <button id="ai-send-btn">&#9654;</button>
          </div>
        </div>
      </div>
    </aside>

    <!-- Mail List -->
    <main id="mail-list-panel">
      <div class="mail-list-header">
        <div class="search-bar">
          <input type="text" id="search-input" placeholder="Search all mail...">
        </div>
        <div class="mail-list-actions">
          <button class="action-btn" id="refresh-btn" title="Refresh">&#8635;</button>
          <select id="filter-select">
            <option value="all">All Mail</option>
            <option value="unread">Unread</option>
            <option value="read">Read</option>
            <option value="vip">VIP Only</option>
          </select>
        </div>
      </div>
      <ul id="mail-list"></ul>
    </main>

    <!-- Mail Detail / Compose -->
    <section id="detail-panel">
      <!-- Read view -->
      <div id="mail-detail" class="hidden">
        <div class="detail-header">
          <button id="back-btn" class="action-btn">&#8592; Back</button>
          <div class="detail-actions">
            <button class="action-btn" id="star-btn" title="Star">&#9734;</button>
            <button class="action-btn" id="vip-btn" title="VIP">&#9826; VIP</button>
            <button class="action-btn" id="snooze-btn" title="Snooze" style="position:relative">&#9200; Snooze</button>
            <button class="action-btn" id="reply-btn" title="Reply">&#8617; Reply</button>
            <button class="action-btn" id="delete-btn" title="Delete">&#128465;</button>
          </div>
        </div>
        <div id="detail-content">
          <h2 id="detail-subject"></h2>
          <div id="detail-category-bar"></div>
          <div id="detail-score-bar"></div>
          <div class="detail-meta">
            <span id="detail-from"></span>
            <span id="detail-date"></span>
          </div>
          <div id="detail-body"></div>
          <div id="detail-attachments"></div>
        </div>
        <div id="ai-summary-bar" class="hidden">
          <button id="ai-summarize-btn" class="btn-ai">&#10024; Summarize</button>
          <button id="ai-reply-suggest-btn" class="btn-ai">&#10024; Suggest Reply</button>
          <button id="ai-calendar-btn" class="btn-ai">&#128197; Add to Calendar</button>
          <div id="ai-result" class="hidden"></div>
        </div>
      </div>

      <!-- Compose view -->
      <div id="compose-panel" class="hidden">
        <div class="compose-header">
          <h2>New Message</h2>
          <button id="close-compose" class="action-btn">&times;</button>
        </div>
        <form id="compose-form">
          <select id="compose-from">
            <option value="zoho-biz">From: Zoho Business</option>
            <option value="zoho-web">From: Zoho Website</option>
            <option value="gmail">From: Gmail Personal</option>
          </select>
          <input type="email" id="compose-to" placeholder="To" required>
          <input type="text" id="compose-subject" placeholder="Subject">
          <div class="compose-toolbar" style="position:relative">
            <button type="button" class="btn-ai" id="ai-draft-btn">&#10024; AI Draft</button>
            <button type="button" class="btn-ai" id="ai-improve-btn">&#10024; Improve</button>
            <button type="button" class="btn-ai" id="template-btn">&#128203; Templates</button>
            <div class="tone-selector">
              <button type="button" class="tone-btn" data-tone="professional">Pro</button>
              <button type="button" class="tone-btn" data-tone="friendly">Friendly</button>
              <button type="button" class="tone-btn" data-tone="formal">Formal</button>
              <button type="button" class="tone-btn" data-tone="brief">Brief</button>
            </div>
          </div>
          <textarea id="compose-body" rows="12" placeholder="Write your message..."></textarea>
          <div class="compose-attachments" id="compose-attachments"></div>
          <div class="compose-actions">
            <button type="submit" class="btn-primary">Send</button>
            <label class="compose-file-btn">
              &#128206; Attach
              <input type="file" id="compose-file" multiple hidden>
            </label>
            <button type="button" id="save-draft-btn" class="btn-secondary">Save Draft</button>
            <button type="button" id="discard-btn" class="btn-secondary">Discard</button>
          </div>
        </form>
      </div>

      <!-- Empty state -->
      <div id="empty-state">
        <div class="empty-state-content">
          <span class="empty-icon">&#9993;</span>
          <h2>Select a message to read</h2>
          <p>Or tell Mx what you need</p>
        </div>
      </div>
    </section>
  </div>

  <!-- Undo send toast (hidden by default) -->
  <div id="undo-toast" class="undo-toast hidden">
    <span>Message sent.</span>
    <div class="undo-progress"><div class="undo-progress-bar" id="undo-progress-bar"></div></div>
    <button class="undo-btn" id="undo-send-btn">Undo</button>
  </div>

  <script src="app.js"></script>
  <script>
    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.register("sw.js").then(function(reg) {
        console.log("SW registered:", reg.scope);
      });
    }
  </script>
</body>
</html>
