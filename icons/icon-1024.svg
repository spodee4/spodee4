<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <!-- Background gradient: deep indigo to dark blue -->
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1e1145"/>
      <stop offset="50%" stop-color="#140e30"/>
      <stop offset="100%" stop-color="#0d0a1f"/>
    </linearGradient>

    <!-- Envelope gradient -->
    <linearGradient id="envGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e8e4f0"/>
      <stop offset="100%" stop-color="#c5bdd6"/>
    </linearGradient>

    <!-- Flap gradient -->
    <linearGradient id="flapGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#d6d0e4"/>
      <stop offset="100%" stop-color="#b8aed0"/>
    </linearGradient>

    <!-- AI accent gradient: vibrant purple to electric blue -->
    <linearGradient id="aiGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#a855f7"/>
      <stop offset="50%" stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>

    <!-- Glow effect -->
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#7c3aed" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#7c3aed" stop-opacity="0"/>
    </radialGradient>

    <!-- Sparkle gradient -->
    <linearGradient id="sparkle" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#c084fc"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>

    <!-- Shadow filter -->
    <filter id="envShadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#000" flood-opacity="0.35"/>
    </filter>

    <filter id="aiGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="6"/>
    </filter>

    <!-- Subtle inner light on envelope -->
    <filter id="innerLight" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="-2" stdDeviation="4" flood-color="#fff" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- Background: rounded square -->
  <rect width="1024" height="1024" rx="224" fill="url(#bg)"/>

  <!-- Subtle ambient glow behind Mx text -->
  <ellipse cx="512" cy="440" rx="360" ry="300" fill="url(#glow)"/>

  <!-- === BIG "Mx" LOGOTYPE — hero text rising from envelope === -->
  <text x="512" y="480" text-anchor="middle" font-family="SF Pro Display, -apple-system, system-ui, Helvetica Neue, sans-serif" font-weight="900" font-size="380" fill="url(#aiGrad)" opacity="0.95" letter-spacing="-8">Mx</text>
  <!-- Subtle text shadow/depth layer -->
  <text x="514" y="483" text-anchor="middle" font-family="SF Pro Display, -apple-system, system-ui, Helvetica Neue, sans-serif" font-weight="900" font-size="380" fill="#1a0e3a" opacity="0.3" letter-spacing="-8">Mx</text>

  <!-- === ENVELOPE (behind bottom of Mx text) === -->
  <g filter="url(#envShadow)">
    <!-- Envelope body — shifted down so Mx rises out of it -->
    <rect x="192" y="480" width="640" height="300" rx="24" fill="url(#envGrad)"/>

    <!-- Envelope inner shadow line -->
    <rect x="192" y="740" width="640" height="40" rx="0" fill="#b8aed0" opacity="0.3"/>

    <!-- Envelope flap (open, tilted back) — behind the Mx text -->
    <path d="M192,504 L512,350 L832,504" fill="url(#flapGrad)" stroke="#a89cc0" stroke-width="2"/>

    <!-- Envelope V-fold lines -->
    <path d="M192,480 L512,640 L832,480" fill="none" stroke="#a89cc0" stroke-width="2.5" opacity="0.6"/>
  </g>

  <!-- === "Mx" rendered AGAIN on top of envelope for layered depth === -->
  <text x="512" y="480" text-anchor="middle" font-family="SF Pro Display, -apple-system, system-ui, Helvetica Neue, sans-serif" font-weight="900" font-size="380" fill="url(#aiGrad)" letter-spacing="-8">Mx</text>

  <!-- === AI BADGE (top-right, overlapping Mx) === -->
  <g>
    <!-- Badge glow -->
    <rect x="656" y="238" width="168" height="72" rx="36" fill="#7c3aed" opacity="0.4" filter="url(#aiGlow)"/>
    <!-- Badge body -->
    <rect x="662" y="244" width="156" height="60" rx="30" fill="url(#aiGrad)"/>
    <!-- Badge text -->
    <text x="740" y="284" text-anchor="middle" font-family="SF Pro Display, -apple-system, system-ui, Helvetica Neue, sans-serif" font-weight="800" font-size="34" fill="#fff" letter-spacing="3">AI</text>
  </g>

  <!-- === SPARKLE DECORATIONS (AI feel) === -->
  <!-- Top-left sparkle -->
  <g transform="translate(220, 240)" fill="url(#sparkle)" opacity="0.8">
    <path d="M0,-20 L5,0 L0,20 L-5,0 Z"/>
    <path d="M-20,0 L0,-5 L20,0 L0,5 Z"/>
  </g>

  <!-- Right sparkle -->
  <g transform="translate(860, 420)" fill="url(#sparkle)" opacity="0.6">
    <path d="M0,-14 L3.5,0 L0,14 L-3.5,0 Z"/>
    <path d="M-14,0 L0,-3.5 L14,0 L0,3.5 Z"/>
  </g>

  <!-- Small sparkle near AI badge -->
  <g transform="translate(850, 280)" fill="#c084fc" opacity="0.5">
    <path d="M0,-10 L2.5,0 L0,10 L-2.5,0 Z"/>
    <path d="M-10,0 L0,-2.5 L10,0 L0,2.5 Z"/>
  </g>

  <!-- Bottom-left sparkle -->
  <g transform="translate(200, 680)" fill="url(#sparkle)" opacity="0.4">
    <path d="M0,-12 L3,0 L0,12 L-3,0 Z"/>
    <path d="M-12,0 L0,-3 L12,0 L0,3 Z"/>
  </g>

  <!-- Top-center small sparkle -->
  <g transform="translate(420, 180)" fill="#c084fc" opacity="0.35">
    <path d="M0,-8 L2,0 L0,8 L-2,0 Z"/>
    <path d="M-8,0 L0,-2 L8,0 L0,2 Z"/>
  </g>

  <!-- === SUBTLE GRID PATTERN (tech feel) === -->
  <g stroke="#7c3aed" stroke-width="0.5" opacity="0.06">
    <line x1="160" y1="160" x2="160" y2="864"/>
    <line x1="288" y1="160" x2="288" y2="864"/>
    <line x1="416" y1="160" x2="416" y2="864"/>
    <line x1="544" y1="160" x2="544" y2="864"/>
    <line x1="672" y1="160" x2="672" y2="864"/>
    <line x1="800" y1="160" x2="800" y2="864"/>
    <line x1="160" y1="288" x2="864" y2="288"/>
    <line x1="160" y1="416" x2="864" y2="416"/>
    <line x1="160" y1="544" x2="864" y2="544"/>
    <line x1="160" y1="672" x2="864" y2="672"/>
    <line x1="160" y1="800" x2="864" y2="800"/>
  </g>

  <!-- === BOTTOM LABEL === -->
  <text x="512" y="860" text-anchor="middle" font-family="SF Pro Display, -apple-system, system-ui, Helvetica Neue, sans-serif" font-weight="700" font-size="48" fill="#c084fc" opacity="0.55" letter-spacing="10">MAIL</text>
</svg>